apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime
  namespace: tarinio-lab
spec:
  template:
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
            readOnlyRootFilesystem: true
          env:
            - name: WAF_CLICKHOUSE_ALLOWED_ENDPOINTS
              value: https://clickhouse:8443
          volumeMounts:
            - name: opensearch-tls
              mountPath: /etc/waf/storage-ca/opensearch
              readOnly: true
            - name: clickhouse-tls
              mountPath: /etc/waf/storage-ca/clickhouse
              readOnly: true
            - name: runtime-state
              mountPath: /etc/waf
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: opensearch-tls
          secret:
            secretName: tarinio-lab-opensearch-tls
        - name: clickhouse-tls
          secret:
            secretName: tarinio-lab-clickhouse-tls
        - name: runtime-state
          emptyDir: {}
        - name: runtime-tmp
          emptyDir: {}
