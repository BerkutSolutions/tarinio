apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: tarinio-ui:lab
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 80
          volumeMounts:
            - name: ui-cache
              mountPath: /var/cache/nginx
            - name: ui-runtime
              mountPath: /var/run
            - name: ui-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthcheck.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: ui-cache
          emptyDir: {}
        - name: ui-runtime
          emptyDir: {}
        - name: ui-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ui
spec:
  selector:
    app: ui
  ports:
    - name: http
      port: 80
      targetPort: 80
