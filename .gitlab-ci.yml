pre-security:failure-gate:
  stage: pre-security
  timeout: 15m
  when: always
  needs:
    - job: e2e:failure-evidence
      artifacts: true
  script:
    - mkdir -p build/pre-security
    - >-
      curl --fail --silent --show-error
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/jobs?per_page=100"
      > build/pre-security/jobs.json
    - |
      python3 - <<'PY'
      import json
      import pathlib
      import sys

      source_path = "build/pre-security/jobs.json"
      summary_path = "build/pre-security/failure-summary.md"
      with open(source_path, encoding="utf-8") as source:
          jobs = json.load(source)

      watched_stages = {"validate", "unit", "e2e"}
      failed = [
          job for job in jobs
          if job.get("stage") in watched_stages
          and job.get("status") == "failed"
      ]
      lines = ["# Pre-security failure summary", ""]

      def browser_findings(root):
          findings = []
          for report_path in sorted(root.glob("*/results.json")):
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  findings.append((report_path.parent.name, f"unreadable results.json: {exc}"))
                  continue
              def walk(groups):
                  for group in groups or []:
                      for spec in group.get("specs", []):
                          for test in spec.get("tests", []):
                              status = test.get("status")
                              if status in {"unexpected", "skipped", "flaky"}:
                                  label = f"{test.get('projectName', '?')} :: {spec.get('title', '?')}"
                                  details = []
                                  for result in test.get("results", []):
                                      for error in result.get("errors", []):
                                          details.append(error.get("message") or error.get("stack") or "test error")
                                  suffix = f" — {details[0].strip()}" if details else ""
                                  findings.append((report_path.parent.name, f"{status}: {label}{suffix}"))
                      walk(group.get("suites", []))
              walk(report.get("suites", []))
              stats = report.get("stats", {})
              if int(stats.get("skipped", 0) or 0) and not any(item[0] == report_path.parent.name and "skipped:" in item[1] for item in findings):
                  findings.append((report_path.parent.name, f"skipped={stats['skipped']} (test details missing from results.json)"))
          return findings

      def go_skips(root):
          findings = []
          for log_path in sorted(root.glob("*/*.log")):
              for line in log_path.read_text(encoding="utf-8", errors="replace").splitlines():
                  if "[SKIP]" in line:
                      findings.append(f"{log_path}: {line.strip()}")
          return findings

      browser_failures = browser_findings(pathlib.Path("build/e2e"))
      skipped = [f"{suite}: {detail}" for suite, detail in browser_failures if "skipped:" in detail or "skipped=" in detail]
      browser_errors = [f"{suite}: {detail}" for suite, detail in browser_failures if "skipped:" not in detail and "skipped=" not in detail]
      skipped += go_skips(pathlib.Path("build/e2e"))
      if skipped:
          print("\n" + "=" * 88 + "\nSKIPPED E2E TESTS (forbidden)\n" + "=" * 88)
          print("\n".join(skipped))
          lines.extend(["## Skipped E2E tests (forbidden)", "", "```text", *skipped, "```", ""])
      if browser_errors:
          print("\n" + "=" * 88 + "\nBROWSER TEST FAILURES\n" + "=" * 88)
          print("\n".join(browser_errors))
          lines.extend(["## Browser test failures", "", "```text", *browser_errors, "```", ""])
      if not failed:
          if skipped:
              lines.append("Security is blocked: skipped E2E executions are not accepted as proof.")
              print("[pre-security] Skipped E2E executions found; security is blocked.")
              with open(summary_path, "w", encoding="utf-8") as summary:
                  summary.write("\n".join(lines) + "\n")
              sys.exit(1)
          lines.append("All validate, unit and E2E jobs passed with no skipped executions.")
          print("[pre-security] No failures in validate, unit or E2E stages.")
          with open(summary_path, "w", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          sys.exit(0)

      print(f"[pre-security] {len(failed)} failed job(s); security is blocked.")
      for job in failed:
          name = job.get("name", "unknown")
          status = job.get("status", "unknown")
          url = job.get("web_url", "")
          heading = f"{name} ({status})"
          print(f"\n{'=' * 88}\n{heading}\n{url}\n{'=' * 88}")
          lines.extend([f"## {heading}", "", url, ""])
          if name.startswith("e2e:"):
              directory = name.removeprefix("e2e:").replace("browser:", "browser-")
              root = pathlib.Path("build/e2e", directory)
              job_log = root / "job.log"
              logs = [job_log] if job_log.exists() else sorted(root.rglob("*.log"))
              if logs:
                  markers = ("[fail]", "--- fail:", "timeouterror:", "error:", "failed to", "panic:", "fatal:", "err_connection_", "cannot publish invalid")
                  excerpts = []
                  for log_path in logs:
                      content = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
                      positions = [index for index, line in enumerate(content) if any(marker in line.lower() for marker in markers)]
                      for index in positions[:3]:
                          start, end = max(0, index - 10), min(len(content), index + 28)
                          excerpt = [f"[{log_path.name}]", *content[start:end]]
                          if excerpt not in excerpts and not any("Uploading artifacts" in line for line in excerpt):
                              excerpts.append(excerpt)
                  diagnostic = [line for excerpt in excerpts for line in excerpt]
                  if not diagnostic:
                      diagnostic = ["No error marker was found in the E2E log."]
                  print("\n".join(diagnostic))
                  lines.extend(["```text", *diagnostic, "```", ""])
                  continue
          message = "No primary failure trace was found in the downloaded artifacts. Check the job's results.json/e2e-evidence.md artifact."
          print(message)
          lines.extend([message, ""])
      with open(summary_path, "w", encoding="utf-8") as summary:
          summary.write("\n".join(lines) + "\n")
      sys.exit(1)
      PY
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/pre-security/

security:gitleaks:
  stage: security
  timeout: 20m
  dependencies: []
  script:
    - mkdir -p build/security
    - >-
      docker run --rm --pull=always
      -v "$CI_PROJECT_DIR:/repo" -w /repo
      zricethezav/gitleaks:v8.30.0
      detect --config /repo/.gitleaks.toml --source /repo
      --redact --report-format json --report-path /repo/build/security/gitleaks.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/security/gitleaks.json

security:trivy:
  stage: security
  timeout: 35m
  dependencies: []
  script:
    - mkdir -p build/security "$TRIVY_CACHE_DIR"
    - >-
      docker run --rm --pull=always
      -v "$CI_PROJECT_DIR:/src" -v "$TRIVY_CACHE_DIR:/root/.cache/trivy"
      aquasec/trivy:0.66.0 fs --scanners vuln,misconfig,secret
      --skip-dirs .git --severity HIGH,CRITICAL --exit-code 0
      --format json --output /src/build/security/trivy-fs.json /src
    - node scripts/verify-trivy-baseline.mjs build/security/trivy-fs.json security/trivy-baseline.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/security/trivy-fs.json

security:trivy-image:
  stage: security
  timeout: 35m
  dependencies: []
  script:
    - mkdir -p build/security "$TRIVY_CACHE_DIR"
    - docker build -t tarinio-ci-security-scan:$CI_COMMIT_SHA -f control-plane/Dockerfile .
    - >-
      docker run --rm --pull=always
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$TRIVY_CACHE_DIR:/root/.cache/trivy"
      -v "$CI_PROJECT_DIR:/src"
      aquasec/trivy:0.66.0 image --scanners vuln --severity HIGH,CRITICAL
      --exit-code 0 --format json --output /src/build/security/trivy-image.json tarinio-ci-security-scan:$CI_COMMIT_SHA
    - node scripts/verify-trivy-image-baseline.mjs build/security/trivy-image.json security/trivy-image-unfixed-baseline.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/security/trivy-image.json

security:govulncheck:
  stage: security
  timeout: 30m
  dependencies: []
  script:
    - mkdir -p .bin
    - GOTOOLCHAIN=go1.26.5 GOBIN="$CI_PROJECT_DIR/.bin" go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
    - .bin/govulncheck ./...

security:npm-audit:
  stage: security
  timeout: 25m
  dependencies: []
  script:
    - mkdir -p "$NPM_CACHE_DIR" .ci-home
    - >-
      docker run --rm --pull=never --user "$(id -u):$(id -g)"
      -e HOME=/workspace/.ci-home -e NPM_CONFIG_CACHE=/npm-cache
      -v "$NPM_CACHE_DIR:/npm-cache"
      -v "$CI_PROJECT_DIR:/workspace" -w /workspace node:24-bookworm
      bash -lc 'npm ci --prefer-offline --no-audit --fund=false && npm audit --omit=dev --audit-level=moderate'

dast:baseline:
  stage: dast
  timeout: 40m
  dependencies: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
  script:
    - mkdir -p build/dast/baseline
    - E2E_PROJECT=ci-dast-baseline E2E_PORT=18680 E2E_RT_PORT=10680 E2E_RT_HTTPS_PORT=16443 E2E_RT_HLT_PORT=18681 E2E_CONTROL_PLANE_DIRECT_PORT=18682 E2E_DAST_CANARY_PORT=18683 DAST_TARGET_URL=http://127.0.0.1:10680 DAST_OUTPUT_DIR="$CI_PROJECT_DIR/build/dast/baseline" sh scripts/run-dast-scan.sh baseline
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/dast/baseline/

dast:negative:
  stage: dast
  timeout: 35m
  dependencies: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
  script:
    - mkdir -p build/dast/negative
    - E2E_PROJECT=ci-dast-negative E2E_PORT=18780 E2E_RT_PORT=10780 E2E_RT_HTTPS_PORT=17443 E2E_RT_HLT_PORT=18781 E2E_CONTROL_PLANE_DIRECT_PORT=18782 E2E_DAST_CANARY_PORT=18783 E2E_FILTER='TestE2ENegativeSecurityProbes|TestE2EDASTAuthenticatedControlPlane|TestE2EDASTSecurityHeadersAndSessionCookie|TestE2EDASTAPIInputFuzz' E2E_TIMEOUT=240 E2E_LOG_DIR="$CI_PROJECT_DIR/build/dast/negative" E2E_EVIDENCE_DIR="$CI_PROJECT_DIR/build/dast/negative" sh scripts/run-e2e-tests.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/dast/negative/

dast:full:
  stage: dast
  timeout: 60m
  dependencies: []
  rules:
    - when: never
  script:
    - mkdir -p build/dast/full
    - E2E_PROJECT=ci-dast-full E2E_PORT=18880 E2E_RT_PORT=10880 E2E_RT_HTTPS_PORT=18443 E2E_RT_HLT_PORT=18881 E2E_CONTROL_PLANE_DIRECT_PORT=18882 E2E_DAST_CANARY_PORT=18883 DAST_TARGET_URL=http://127.0.0.1:10880 DAST_OUTPUT_DIR="$CI_PROJECT_DIR/build/dast/full" sh scripts/run-dast-scan.sh full
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/dast/full/

publish:github-mirror:
  stage: publish
  timeout: 15m
  dependencies: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: false
    - when: never
  script:
    - |
      set -eu
      test -n "${GITHUB_TOKEN:-}" || { echo "GITHUB_TOKEN is required for GitHub mirroring" >&2; exit 1; }
      askpass="$CI_PROJECT_DIR/.git-askpass"
      trap 'rm -f "$askpass"' EXIT
      cat > "$askpass" <<'EOF'
      #!/bin/sh
      case "$1" in
        *Username*) printf '%s\n' x-access-token ;;
        *) printf '%s\n' "$GITHUB_TOKEN" ;;
      esac
      EOF
      chmod 700 "$askpass"
      GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
        git push "https://github.com/BerkutSolutions/tarinio.git" HEAD:main

publish:github-release:
  stage: publish
  timeout: 45m
  dependencies:
    - security:trivy
    - security:trivy-image
    - e2e:smoke
    - e2e:security-invariants
    - e2e:management-rate-limit
    - e2e:full
    - e2e:browser:gate
    - dast:baseline
    - dast:negative
  needs:
    - publish:github-mirror
    - security:trivy
    - security:trivy-image
    - e2e:smoke
    - e2e:security-invariants
    - e2e:management-rate-limit
    - e2e:full
    - e2e:browser:gate
    - dast:baseline
    - dast:negative
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: false
    - when: never
  script:
    - |
      set -eu
      test -n "${GITHUB_TOKEN:-}" || { echo "GITHUB_TOKEN is required for GitHub publishing" >&2; exit 1; }
      test -n "${RELEASE_SIGNING_PRIVATE_KEY_B64:-}" || { echo "RELEASE_SIGNING_PRIVATE_KEY_B64 is required for signed release artifacts" >&2; exit 1; }
      test -n "${RELEASE_SIGNING_PUBLIC_KEY_B64:-}" || { echo "RELEASE_SIGNING_PUBLIC_KEY_B64 is required for release verification" >&2; exit 1; }
      app_version="$(sed -n 's/^var AppVersion = "\(.*\)"/\1/p' control-plane/internal/appmeta/meta.go | head -n1)"
      release_tag="${CI_COMMIT_TAG:-v$app_version}"
      version="${release_tag#v}"
      test "$version" = "$app_version" || { echo "tag $release_tag does not match AppVersion $app_version" >&2; exit 1; }
      mkdir -p .work/release-signing build/release/"$version"
      printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY_B64" | base64 -d > .work/release-signing/release-ed25519-private.pem
      printf '%s' "$RELEASE_SIGNING_PUBLIC_KEY_B64" | base64 -d > .work/release-signing/release-ed25519-public.pem
      chmod 600 .work/release-signing/release-ed25519-private.pem
      go run ./cmd/release-artifacts \
        -version "$version" \
        -commit "$CI_COMMIT_SHA" \
        -tag "$release_tag" \
        -output "build/release/$version" \
        -docker-tags "ghcr.io/berkutsolutions/tarinio:$version,ghcr.io/berkutsolutions/tarinio:latest"
      go run ./cmd/release-artifacts-verify -output "build/release/$version" -trusted-public-key .work/release-signing/release-ed25519-public.pem
      askpass="$CI_PROJECT_DIR/.git-askpass"
      export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker-publish"
      trap 'rm -rf "$askpass" "$DOCKER_CONFIG" .work/release-signing/release-ed25519-private.pem .work/release-signing/release-ed25519-public.pem' EXIT
      cat > "$askpass" <<'EOF'
      #!/bin/sh
      case "$1" in
        *Username*) printf '%s\n' x-access-token ;;
        *) printf '%s\n' "$GITHUB_TOKEN" ;;
      esac
      EOF
      chmod 700 "$askpass"
      git config user.name "GitLab CI Release"
      git config user.email "gitlab-ci@berkutsolutions.local"
      if GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code --tags "https://github.com/BerkutSolutions/tarinio.git" "refs/tags/$release_tag" >/dev/null 2>&1; then
        remote_tag_sha="$(GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git ls-remote "https://github.com/BerkutSolutions/tarinio.git" "refs/tags/$release_tag^{}" | awk '{print $1}')"
        test "$remote_tag_sha" = "$CI_COMMIT_SHA" || { echo "GitHub tag $release_tag already points to another commit" >&2; exit 1; }
      else
        git tag -a "$release_tag" -m "Release $release_tag" "$CI_COMMIT_SHA"
      fi
      GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
        git push "https://github.com/BerkutSolutions/tarinio.git" "refs/tags/$release_tag"
      echo "[release] GitHub tag $release_tag is available"
      echo "[release] Building GitHub release notes from CHANGELOG.md"
      python3 scripts/extract-changelog-section.py \
        --changelog CHANGELOG.md \
        --version "$version" \
        --output "build/release/$version/github-release-notes.md"
      test -s "build/release/$version/github-release-notes.md"
      echo "[release] Collecting verified E2E, DAST and internal Trivy evidence"
      python3 scripts/write-release-evidence.py \
        --e2e-root build/e2e \
        --dast-root build/dast \
        --trivy-report build/security/trivy-fs.json \
        --trivy-image-report build/security/trivy-image.json \
        --output-dir "build/release/$version" \
        --version "$version" \
        --commit "$CI_COMMIT_SHA"
      cat "build/release/$version/release-evidence-summary.md" >> "build/release/$version/github-release-notes.md"
      echo "[release] Internal Trivy classification (GitLab job log and artifact only)"
      cat "build/release/$version/release-trivy-summary.md"
      echo "[release] Authenticating with GHCR"
      printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u BerkutSolutions --password-stdin
      echo "[release] Building image ghcr.io/berkutsolutions/tarinio:$version"
      docker build -t "ghcr.io/berkutsolutions/tarinio:$version" -f control-plane/Dockerfile .
      echo "[release] Running image health check"
      docker rm -f tarinio-release-smoke >/dev/null 2>&1 || true
      smoke_port=18082
      docker run -d --rm --name tarinio-release-smoke -e CONTROL_PLANE_SECURITY_PEPPER=release-smoke-pepper -p "127.0.0.1:$smoke_port:8080" "ghcr.io/berkutsolutions/tarinio:$version"
      i=0; until curl -fsS "http://127.0.0.1:$smoke_port/healthz" >/dev/null; do i=$((i + 1)); test "$i" -lt 30 || { docker logs tarinio-release-smoke; exit 1; }; sleep 1; done
      docker rm -f tarinio-release-smoke >/dev/null
      docker tag "ghcr.io/berkutsolutions/tarinio:$version" "ghcr.io/berkutsolutions/tarinio:latest"
      echo "[release] Publishing versioned GHCR image"
      docker push "ghcr.io/berkutsolutions/tarinio:$version"
      echo "[release] Publishing latest GHCR image"
      docker push "ghcr.io/berkutsolutions/tarinio:latest"
      echo "[release] Creating or updating GitHub Release"
      echo "[release] Uploading signed release and verification evidence"
      python3 scripts/publish-github-release.py \
        --repo BerkutSolutions/tarinio \
        --tag "$release_tag" \
        --title "TARINIO $version" \
        --notes "build/release/$version/github-release-notes.md" \
        --asset "build/release/$version/release-manifest.json" \
        --asset "build/release/$version/signature.json" \
        --asset "build/release/$version/sbom.cdx.json" \
        --asset "build/release/$version/provenance.json" \
        --asset "build/release/$version/checksums.txt" \
        --asset "build/release/$version/release-evidence.md" \
        --asset "build/release/$version/release-evidence.json" \
        --asset "build/release/$version/release-evidence-summary.md" \
        --asset "build/release/$version/release-evidence-source.zip"
  artifacts:
    expire_in: 30 days
    paths:
      - build/release/
