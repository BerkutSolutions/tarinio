.e2e:browser:
  stage: e2e
  allow_failure: true
  timeout: 90m
  # The shell runner shares one Docker daemon. Browser shards are intentionally
  # serialized so their disposable stacks cannot starve each other (or make
  # the control-plane Docker metrics endpoint observe a moving host-wide set).
  resource_group: waf-e2e-browser-runner
  dependencies: []
  script:
    - test -n "${WAF_E2E_PASSWORD:-}" || { echo "WAF_E2E_PASSWORD is required" >&2; exit 1; }
    - mkdir -p "build/e2e/$E2E_BROWSER_SLICE"
    - |
      set -o pipefail
      E2E_BROWSER_JOB_LOG="$CI_PROJECT_DIR/build/e2e/$E2E_BROWSER_SLICE/job.log"
      BROWSER_E2E_IMAGE_JOB="${BROWSER_E2E_IMAGE}-${CI_PROJECT_ID}-${CI_PIPELINE_ID}-${E2E_BROWSER_SLICE}"
      docker build -t "$BROWSER_E2E_IMAGE_JOB" -f e2e/browser/Dockerfile.ci . 2>&1 | tee "$E2E_BROWSER_JOB_LOG"
      E2E_BROWSER_ONLY=1
      E2E_BROWSER_IMAGE="$BROWSER_E2E_IMAGE_JOB"
      E2E_BROWSER_SPECS="$E2E_BROWSER_SPECS"
      E2E_PROJECT="${E2E_BROWSER_PROJECT}-${CI_PIPELINE_ID}"
      E2E_PORT="$E2E_BROWSER_UI_PORT"
      E2E_RT_PORT="$E2E_BROWSER_RUNTIME_PORT"
      E2E_RT_HTTPS_PORT="$E2E_BROWSER_HTTPS_PORT"
      E2E_RT_HLT_PORT="$E2E_BROWSER_HEALTH_PORT"
      E2E_CONTROL_PLANE_DIRECT_PORT="$E2E_BROWSER_CONTROL_PORT"
      E2E_DAST_CANARY_PORT="$E2E_BROWSER_CANARY_PORT"
      E2E_MTLS_UPSTREAM_PORT="$E2E_BROWSER_MTLS_PORT"
      E2E_TIMEOUT=300
      E2E_LOG_DIR="$CI_PROJECT_DIR/build/e2e/$E2E_BROWSER_SLICE"
      E2E_EVIDENCE_DIR="$CI_PROJECT_DIR/build/e2e/$E2E_BROWSER_SLICE"
      WAF_BROWSER_RESULTS_FILE="../../build/e2e/$E2E_BROWSER_SLICE/results.json"
      WAF_BROWSER_OUTPUT_DIR="../../build/e2e/$E2E_BROWSER_SLICE/artifacts"
      WAF_BROWSER_JUNIT_FILE="../../build/e2e/$E2E_BROWSER_SLICE/junit.xml"
      WAF_E2E_RUN_ID="$CI_PIPELINE_ID-$E2E_BROWSER_SLICE"
      export E2E_BROWSER_ONLY E2E_BROWSER_IMAGE E2E_BROWSER_SPECS E2E_PROJECT E2E_PORT E2E_RT_PORT E2E_RT_HTTPS_PORT E2E_RT_HLT_PORT E2E_CONTROL_PLANE_DIRECT_PORT E2E_DAST_CANARY_PORT E2E_MTLS_UPSTREAM_PORT E2E_TIMEOUT E2E_LOG_DIR E2E_EVIDENCE_DIR WAF_BROWSER_RESULTS_FILE WAF_BROWSER_OUTPUT_DIR WAF_BROWSER_JUNIT_FILE WAF_E2E_RUN_ID
      sh scripts/run-e2e-tests.sh 2>&1 | tee -a "$E2E_BROWSER_JOB_LOG"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/e2e/$E2E_BROWSER_SLICE/
    reports:
      junit: build/e2e/$E2E_BROWSER_SLICE/junit.xml

