stages:
  - validate
  - unit
  - e2e
  - e2e-report
  - pre-security
  - security
  - dast
  - publish

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

default:
  tags:
    - waf-secure
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "0"
  GOTOOLCHAIN: auto
  GOCACHE: /home/gitlab-runner/.cache/tarinio/go-build
  GOMODCACHE: /home/gitlab-runner/.cache/tarinio/go-mod
  NPM_CACHE_DIR: /home/gitlab-runner/.cache/tarinio/npm
  TRIVY_CACHE_DIR: /home/gitlab-runner/.cache/tarinio/trivy
  BROWSER_E2E_IMAGE: tarinio-playwright-e2e:1.61.1

validate:repository:
  stage: validate
  allow_failure: true
  timeout: 10m
  script:
    - git diff --check
    - sh -n scripts/install-aio.sh
    - sh -n scripts/install-aio-enterprise.sh
    - test -f go.mod
    - test -f package-lock.json
    - grep -q '^RUN GOTOOLCHAIN=auto go test ./ui/tests$' ui/Dockerfile
    - >-
      if ! test -d e2e/browser/tests; then
        echo 'Playwright E2E sources are missing from this commit'; exit 1;
      elif grep -REn 'test\.(skip|fixme|only|fail)|describe\.(skip|fixme|only)' e2e/browser/tests; then
        echo 'Playwright skip/fixme/only/fail is forbidden'; exit 1;
      fi
    - cd e2e/browser && npm ci --prefer-offline --no-audit --fund=false && npm run test:coverage && npm run test:strict-results

warm:e2e-images:
  stage: unit
  allow_failure: true
  timeout: 20m
  script:
    - |
      set -eu
      for image in postgres:15 hashicorp/vault:1.18 ealen/echo-server:latest ghcr.io/zaproxy/zaproxy:stable golang:1.26.5-bookworm node:24-bookworm debian:13-slim docker:29-cli nginx:1.27-alpine alpine:3.20 mcr.microsoft.com/playwright:v1.61.1-noble; do
        if docker image inspect "$image" >/dev/null 2>&1; then
          echo "[ci] E2E base image is cached: $image"
        else
          attempt=1
          until docker pull "$image"; do
            if [ "$attempt" -ge 3 ]; then
              echo "[ci] Could not pull E2E base image after $attempt attempts: $image" >&2
              exit 1
            fi
            echo "[ci] Pull failed for $image; retrying in $((attempt * 5))s" >&2
            sleep "$((attempt * 5))"
            attempt=$((attempt + 1))
          done
        fi
      done

unit:go:
  stage: unit
  allow_failure: true
  timeout: 35m
  needs:
    - warm:e2e-images
  script:
    - mkdir -p .ci-bin .ci-home "$NPM_CACHE_DIR"
    - |
      cat > .ci-bin/npm <<'EOF'
      #!/bin/sh
      set -eu
      repo_dir="$(pwd -P)"
      exec docker run --rm --pull=never --user "$(id -u):$(id -g)" \
        -e HOME=/workspace/.ci-home -e NPM_CONFIG_CACHE=/npm-cache \
        -v "$NPM_CACHE_DIR:/npm-cache" \
        -v "$repo_dir:/workspace" -w /workspace node:24-bookworm npm "$@"
      EOF
    - chmod 700 .ci-bin/npm
    - export PATH="$CI_PROJECT_DIR/.ci-bin:$PATH"
    - go version
    - go vet ./...
    - go test ./... -count=1
    - go mod verify

docs:build:
  stage: unit
  allow_failure: true
  timeout: 30m
  needs:
    - warm:e2e-images
  script:
    - mkdir -p "$NPM_CACHE_DIR" .ci-home
    - >-
      docker image inspect node:24-bookworm >/dev/null
      && docker run --rm --user "$(id -u):$(id -g)"
      -e HOME=/workspace/.ci-home -e NPM_CONFIG_CACHE=/npm-cache
      -v "$NPM_CACHE_DIR:/npm-cache"
      -v "$CI_PROJECT_DIR:/workspace" -w /workspace node:24-bookworm
      bash -lc 'npm ci --prefer-offline --no-audit --fund=false && npm run docs:build'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build/

